spring.application.name=payment
spring.datasource.url=jdbc:mysql://localhost:3307/paymentschema
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.security.user.name = user
spring.security.user.password = user
spring.config.import=optional:file:.env[.properties]
# Redis configuration using docker container
spring.data.redis.host=localhost
spring.data.redis.port=6379
security.jwt.secret-key=${SECRET_KEY}

# security.jwt.expiration-time=3600000
logging.level.root=WARN

#email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MY_EMAIL}
spring.mail.password=${MY_EMAIL_PASSWORD}
# Protocol and encoding
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# Additional SMTP properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
