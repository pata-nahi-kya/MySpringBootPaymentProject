<!doctype html>
<html>
  <head>
    <title>WebSocket Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: auto;
      }
      .chat-section {
        border: 1px solid #ccc;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 5px;
      }
      ul {
        list-style-type: none;
        padding: 0;
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #eee;
        padding: 5px;
      }
      li {
        background: #eee;
        margin: 5px 0;
        padding: 8px;
        border-radius: 3px;
      }
      .form-group {
        margin-bottom: 10px;
      }
      input[type="text"] {
        padding: 8px;
        width: calc(100% - 130px);
        margin-right: 5px;
      }
      button {
        padding: 8px 15px;
        cursor: pointer;
      }
      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .top-row button {
        margin-left: 10px;
      }
      .status {
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="top-row">
      <h2>WebSocket Chat</h2>
      <div>
        <button onclick="logout()">Logout</button>
        <button onclick="window.location.href = 'dashboard.html'">
          Dashboard
        </button>
      </div>
    </div>

    <div class="chat-section">
      <h3>Connection</h3>
      <p id="connection-status" class="status" style="color: red">
        Disconnected
      </p>
      <button onclick="connect()">Connect</button>
      <button onclick="disconnect()">Disconnect</button>
    </div>

    <div class="chat-section">
      <h3>Public Chat</h3>
      <div class="form-group">
        <input
          type="text"
          id="public-message"
          placeholder="Type a public message..."
        />
        <button onclick="sendPublicMessage()">Send Publicly</button>
      </div>
      <ul id="public-messages"></ul>
    </div>

    <div class="chat-section">
      <h3>Private Chat</h3>
      <div class="form-group">
        <input
          type="text"
          id="private-receiver"
          placeholder="Receiver username"
          style="width: 100%; margin-bottom: 10px"
        />
      </div>
      <div class="form-group">
        <input
          type="text"
          id="private-message"
          placeholder="Type a private message..."
        />
        <button onclick="sendPrivateMessage()">Send Privately</button>
      </div>
      <ul id="private-messages"></ul>
    </div>

    <script>
      
      let stompClient = null;

      async function verifySession() {
        const token = localStorage.getItem("jwtToken");
        if (!token) {
          window.location.href = "index.html";
          return;
        }

        try {
          await axios.get(`/bank/user/current`, {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });
        } catch (error) {
          console.error("Session validation failed", error);
          window.location.href = "index.html";
        }
      }

      function connect() {
        const token = localStorage.getItem("jwtToken") || "";
        const socket = new SockJS("/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect(
          {
            Authorization: "Bearer " + token,
          },
          function (frame) {
            console.log("Connected: " + frame);
            updateConnectionStatus("Connected", "green");

            stompClient.subscribe("/topic/messages", function (response) {
              displayPublicMessage(response.body);
            });

            stompClient.subscribe(
              "/user/queue/private-messages",
              function (response) {
                const messageObj = JSON.parse(response.body);
                displayPrivateMessage(messageObj.sender, messageObj.content);
              },
            );
          },
          function (error) {
            console.error("Error connecting: ", error);
            updateConnectionStatus("Connection Failed", "red");
          },
        );
      }

      function disconnect() {
        if (stompClient !== null) {
          stompClient.disconnect();
        }
        updateConnectionStatus("Disconnected", "red");
      }

      function updateConnectionStatus(status, color) {
        const el = document.getElementById("connection-status");
        el.innerText = status;
        el.style.color = color;
      }

      function sendPublicMessage() {
        const messageInput = document.getElementById("public-message").value;
        if (messageInput && stompClient && stompClient.connected) {
          stompClient.send(
            "/app/hello",
            {
              Authorization:
                "Bearer " + (localStorage.getItem("jwtToken") || ""),
            },
            messageInput,
          );
          document.getElementById("public-message").value = "";
        } else {
          alert("Connect first or enter a message.");
        }
      }

      function displayPublicMessage(messageContent) {
        const li = document.createElement("li");
        li.innerText = messageContent;
        document.getElementById("public-messages").appendChild(li);
      }

      function sendPrivateMessage() {
        const receiver = document
          .getElementById("private-receiver")
          .value.trim();
        const content = document.getElementById("private-message").value.trim();
        if (receiver && content && stompClient && stompClient.connected) {
          const username = localStorage.getItem("username") || "Unknown";
          const chatMessage = {
            type: "CHAT",
            content,
            sender: username,
            receiver,
          };

          stompClient.send(
            "/app/private-message",
            {},
            JSON.stringify(chatMessage),
          );
          displayPrivateMessage(`${username} to ${receiver}`, content);
          document.getElementById("private-message").value = "";
        } else {
          alert("Please connect and fill in both receiver and message.");
        }
      }

      function displayPrivateMessage(sender, content) {
        const li = document.createElement("li");
        li.innerText = `${sender}: ${content}`;
        li.style.backgroundColor = "#e6f7ff";
        li.style.borderLeft = "4px solid #1890ff";
        document.getElementById("private-messages").appendChild(li);
      }

      function logout() {
        localStorage.removeItem("jwtToken");
        window.location.href = "index.html";
      }

      window.onload = verifySession;
    </script>
  </body>
</html>
