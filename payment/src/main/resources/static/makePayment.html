<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment System - Make Payment</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .payment-container {
        background-color: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 400px;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
      }
      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 30px;
      }
      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .submit-btn {
        background-color: #4caf50;
        color: white;
      }
      .submit-btn:hover {
        background-color: #45a049;
      }
      .cancel-btn {
        background-color: #f44336;
        color: white;
      }
      .cancel-btn:hover {
        background-color: #d32f2f;
      }
      .message {
        margin-top: 20px;
        padding: 10px;
        border-radius: 4px;
        text-align: center;
        display: none;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div class="payment-container">
      <h1>Make a Payment</h1>
      <form id="paymentForm">
        <div class="form-group">
          <label for="receiverId">Receiver Account ID:</label>
          <input
            type="number"
            id="receiverId"
            placeholder="Enter receiver's account ID"
            required
          />
        </div>

        <div class="form-group">
          <label for="amount">Amount ($):</label>
          <input
            type="number"
            id="amount"
            placeholder="Enter amount to transfer"
            min="1"
            step="1"
            required
          />
        </div>

        <div class="button-group">
          <button type="button" class="cancel-btn" onclick="goBack()">
            Cancel
          </button>
          <button type="submit" class="submit-btn">Process Payment</button>
        </div>
      </form>

      <div id="message" class="message"></div>
    </div>

    <script>
      
      const token = localStorage.getItem("jwtToken");
      const messageDiv = document.getElementById("message");

      if (!token) {
        window.location.href = "index.html";
      }

      function showMessage(text, status) {
        messageDiv.textContent = text;
        messageDiv.className = `message ${status}`;
        messageDiv.style.display = "block";
      }

      async function refreshToken() {
        try {
          const response = await axios.post(`/bank/auth/refresh`, null, {
            withCredentials: true,
          });
          if (response.data?.token) {
            localStorage.setItem("jwtToken", response.data.token);
            return true;
          }
        } catch (err) {
          console.warn("Refresh failed", err);
        }
        logout();
        return false;
      }

      async function sendRequest(config) {
        config.headers = config.headers || {};
        config.headers.Authorization = `Bearer ${localStorage.getItem("jwtToken")}`;
        try {
          const response = await axios(config);
          return response.data;
        } catch (error) {
          if (error.response?.status === 401) {
            const refreshed = await refreshToken();
            if (refreshed) {
              config.headers.Authorization = `Bearer ${localStorage.getItem("jwtToken")}`;
              const retryResponse = await axios(config);
              return retryResponse.data;
            }
          }
          throw error;
        }
      }

      document
        .getElementById("paymentForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          messageDiv.style.display = "none";

          const receiverId = Number(
            document.getElementById("receiverId").value,
          );
          const amount = Number(document.getElementById("amount").value);

          try {
            const userData = await sendRequest({
              method: "get",
              url: `/bank/user/current`,
            });

            const payload = {
              senderId: Number(userData.id),
              receiverId,
              amount,
            };

            await sendRequest({
              method: "post",
              url: `/bank/user/moneyTransfer`,
              data: payload,
            });

            showMessage("Payment successful! Transfer completed.", "success");
            document.getElementById("paymentForm").reset();
            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 2500);
          } catch (error) {
            const message =
              error.response?.data?.message ||
              "An error occurred. Please try again.";
            showMessage(message, "error");
          }
        });

      function goBack() {
        window.location.href = "dashboard.html";
      }

      function logout() {
        localStorage.removeItem("jwtToken");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
