<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment System - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
      }
      .dashboard-container {
        max-width: 800px;
        margin: 0 auto;
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .user-details {
        margin: 20px 0;
        padding: 20px;
        background-color: #f9f9f9;
        border-radius: 4px;
      }
      .user-details h2 {
        margin-top: 0;
        color: #555;
      }
      .user-details p {
        margin: 5px 0;
      }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 30px;
      }
      .dashboard-button {
        background-color: #2196f3;
        color: white;
        padding: 15px 24px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
        min-width: 180px;
      }
      .dashboard-button:hover {
        background-color: #0b7dda;
      }
      .secondary-button {
        background-color: #6f42c1;
      }
      .secondary-button:hover {
        background-color: #5935a1;
      }
      .logout-button {
        background-color: #f44336;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        position: absolute;
        top: 20px;
        right: 20px;
      }
      .logout-button:hover {
        background-color: #d32f2f;
      }
      .error-banner {
        background-color: #fdecea;
        color: #b71c1c;
        border: 1px solid #f5c6cb;
        padding: 12px;
        border-radius: 4px;
        margin-top: 20px;
        display: none;
      }
    </style>
  </head>
  <body>
    <button class="logout-button" onclick="logout()">Logout</button>

    <div class="dashboard-container">
      <h1>Welcome to Your Dashboard</h1>

      <div class="user-details">
        <h2>Current Details</h2>
        <p><strong>Username:</strong> <span id="userName">Loading...</span></p>
        <p>
          <strong>Account Balance:</strong>
          $<span id="accountBalance">Loading...</span>
        </p>
        <p>
          <strong>Account ID:</strong>
          <span id="accountNumber">Loading...</span>
        </p>
      </div>

      <div class="button-row">
        <button class="dashboard-button" onclick="gotoPayment()">
          Make Payment
        </button>
        <button class="dashboard-button secondary-button" onclick="gotoChat()">
          Open Chat
        </button>
        <button class="dashboard-button" onclick="gotoCreateUser()">
          Create User
        </button>
      </div>

      <div id="errorBanner" class="error-banner"></div>
    </div>

    <script>
      const apiBase = "/bank";
      const token = localStorage.getItem("jwtToken");
      const errorBanner = document.getElementById("errorBanner");

      if (!token) {
        window.location.href = "index.html";
      }

      function showError(message) {
        errorBanner.textContent = message;
        errorBanner.style.display = message ? "block" : "none";
      }

      async function refreshToken() {
        try {
          const response = await axios.post(`${apiBase}/auth/refresh`, null, {
            withCredentials: true,
          });
          if (response.data?.token) {
            localStorage.setItem("jwtToken", response.data.token);
            return true;
          }
        } catch (err) {
          console.warn("Refresh token failed", err);
        }
        logout();
        return false;
      }

      async function sendRequest(config) {
        config.headers = config.headers || {};
        config.headers.Authorization = `Bearer ${localStorage.getItem("jwtToken")}`;
        try {
          const response = await axios(config);
          return response.data;
        } catch (error) {
          if (error.response?.status === 401) {
            const refreshed = await refreshToken();
            if (refreshed) {
              config.headers.Authorization = `Bearer ${localStorage.getItem("jwtToken")}`;
              const retryResponse = await axios(config);
              return retryResponse.data;
            }
          }
          throw error;
        }
      }

      async function loadUserDetails() {
        try {
          const userData = await sendRequest({
            method: "get",
            url: `${apiBase}/user/current`,
          });
          document.getElementById("userName").textContent =
            userData.CustomerName || "N/A";
          document.getElementById("accountBalance").textContent =
            userData.money || "0";
          document.getElementById("accountNumber").textContent =
            userData.id || "N/A";
        } catch (error) {
          console.error("Load user failed", error);
          showError("Failed to load profile. Please login again.");
        }
      }

      function gotoPayment() {
        window.location.href = "makePayment.html";
      }

      function gotoChat() {
        window.location.href = "chatsection.html";
      }

      function gotoCreateUser() {
        window.location.href = "register.html";
      }

      function logout() {
        localStorage.removeItem("jwtToken");
        window.location.href = "index.html";
      }

      window.onload = loadUserDetails;
    </script>
  </body>
</html>
