<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment System - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
      }
      .dashboard-container {
        max-width: 800px;
        margin: 0 auto;
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .user-details {
        margin: 20px 0;
        padding: 20px;
        background-color: #f9f9f9;
        border-radius: 4px;
      }
      .user-details h2 {
        margin-top: 0;
        color: #555;
      }
      .user-details p {
        margin: 5px 0;
      }
      .payment-section {
        text-align: center;
        margin: 30px 0;
      }
      .payment-button {
        background-color: #2196f3;
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 4px;
        font-size: 18px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .payment-button:hover {
        background-color: #0b7dda;
      }
      .logout-button {
        background-color: #f44336;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        position: absolute;
        top: 20px;
        right: 20px;
      }
      .logout-button:hover {
        background-color: #d32f2f;
      }
      .chat-section {
        margin: 30px 0;
        border-top: 1px solid #ddd;
        padding-top: 20px;
      }
      .chat-section h2 {
        color: #555;
        margin-bottom: 15px;
      }
      .chat-container {
        border: 1px solid #ddd;
        border-radius: 4px;
        height: 300px;
        display: flex;
        flex-direction: column;
      }
      .chat-messages {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        background-color: #fafafa;
      }
      .chat-message {
        margin-bottom: 10px;
        padding: 8px;
        border-radius: 4px;
        max-width: 70%;
      }
      .chat-message.sent {
        background-color: #007bff;
        color: white;
        margin-left: auto;
        text-align: right;
      }
      .chat-message.received {
        background-color: #e9ecef;
        color: #333;
      }
      .chat-input {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
        background-color: white;
      }
      .chat-input input {
        flex: 1;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-right: 10px;
      }
      .chat-input button {
        padding: 8px 15px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .chat-input button:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <button class="logout-button" onclick="logout()">Logout</button>

    <div class="dashboard-container">
      <h1>Welcome to Your Dashboard</h1>

      <div class="user-details">
        <h2>Current Details</h2>
        <p><strong>Username:</strong> <span id="userName">Loading...</span></p>
        <p>
          <strong>Account Balance:</strong> $<span id="accountBalance"
            >Loading...</span
          >
        </p>
        <p>
          <strong>Account ID:</strong>
          <span id="accountNumber">Loading...</span>
        </p>
      </div>

      <div class="action-buttons" style="text-align: center; margin: 30px 0">
        <button class="payment-button" onclick="makePayment()">
          Make Payment
        </button>
        <button
          class="payment-button"
          style="background-color: #6f42c1; margin-left: 15px"
          onclick="window.location.href = 'chatsection.html'"
        >
          Open Chat Section
        </button>
      </div>
    </div>

    <script>
      // Check if user is logged in
      const token = localStorage.getItem("jwtToken");
      if (!token) {
        window.location.href = "index.html";
      }

      // Load user details
      async function loadUserDetails() {
        try {
          const response = await fetch("/bank/user/current", {
            method: "GET",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
          });

          if (response.ok) {
            const userData = await response.json();
            document.getElementById("userName").textContent =
              userData.customerName || "N/A";
            document.getElementById("accountBalance").textContent =
              userData.money || "0";
            document.getElementById("accountNumber").textContent =
              userData.id || "N/A";
          } else {
            // If API fails, show placeholder
            document.getElementById("userName").textContent = "John Doe";
            document.getElementById("accountBalance").textContent = "1500.00";
            document.getElementById("accountNumber").textContent = "1234567890";
          }
        } catch (error) {
          console.error("Error loading user details:", error);
          // Fallback to placeholder
          document.getElementById("userName").textContent = "John Doe";
          document.getElementById("accountBalance").textContent = "1500.00";
          document.getElementById("accountNumber").textContent = "1234567890";
        }
      }

      // this mean when the page loads it will call the loadUserDetails function to fetch and display user details from the API, if the API call fails it will show placeholder data.
      window.onload = loadUserDetails;

      function makePayment() {
        window.location.href = "makePayment.html";
      }

      function logout() {
        localStorage.removeItem("jwtToken");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
