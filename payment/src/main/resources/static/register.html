<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment System - Register Account</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .register-container {
        background-color: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 380px;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
      }
      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: bold;
      }
      input, select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        background-color: #4caf50;
        color: white;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #45a049;
      }
      .secondary-button {
        background-color: #6c757d;
        margin-top: 10px;
      }
      .secondary-button:hover {
        background-color: #5a6268;
      }
      .message {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        text-align: center;
        display: none;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      /* Visual state helper classes */
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <h1 id="panelTitle">Create Account</h1>
      
      <!-- STEP 1: Main User Details Form -->
      <form id="registerForm">
        <div class="form-group">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" placeholder="Username" required />
        </div>
        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="example@gmail.com" required />
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="Password" required />
        </div>
        <div class="form-group">
          <label for="regMoney">Initial Balance</label>
          <input type="number" id="regMoney" placeholder="Initial balance" min="0" value="0" />
        </div>
        <div class="form-group">
          <label for="regRole">Role</label>
          <select id="regRole" required>
            <option value="">Select Role</option>
            <option value="USER">User</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <button type="submit">Send Verification OTP</button>
      </form>

      <!-- STEP 2: OTP Verification Form (Hidden Initially) -->
      <form id="otpForm" class="hidden">
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
          An active verification code was dispatched to your email address.
        </p>
        <div class="form-group">
          <label for="verificationOtp">6-Digit OTP Code</label>
          <input type="text" id="verificationOtp" placeholder="Enter OTP" maxlength="6" required />
        </div>
        <button type="submit">Verify & Create Account</button>
      </form>

      <button class="secondary-button" onclick="goToLogin()">Back to Login</button>
      <div id="message" class="message"></div>
    </div>

    <script>
      const errorBanner = document.getElementById("message");
      const registerForm = document.getElementById("registerForm");
      const otpForm = document.getElementById("otpForm");
      const panelTitle = document.getElementById("panelTitle");
      
      // Temporary in-memory variable to track user email across the multi-step form execution
      let cachedEmailAddress = "";

      function showMessage(text, type) {
        errorBanner.textContent = text;
        errorBanner.className = `message ${type}`;
        errorBanner.style.display = "block";
      }

      // STEP 1 Submission handler: POST user details to unauthenticated endpoint
      registerForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorBanner.style.display = "none";

        const customerName = document.getElementById("regUsername").value.trim();
        const email = document.getElementById("regEmail").value.trim().toLowerCase();
        const password = document.getElementById("regPassword").value.trim();
        const money = Number(document.getElementById("regMoney").value) || 0;
        const role = document.getElementById("regRole").value;

        if (!customerName || !email || !password || !role) {
          showMessage("Please fill in all fields.", "error");
          return;
        }

        const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
        if (!gmailRegex.test(email)) {
          showMessage("Please enter a valid Gmail address (e.g., user@gmail.com).", "error");
          return;
        }

        try {
          // Clean public URL target bypassing the secure JWT /admin dashboard middleware context
          await axios.post("/bank/auth/register/initiate", {
            customerName: customerName,
            email: email,
            password: password,
            money: money,
            role: [role]
          });

          // Cache email address for Step 2 execution context
          cachedEmailAddress = email;

          // Swap UI View States dynamically
          registerForm.classList.add("hidden");
          otpForm.classList.remove("hidden");
          panelTitle.textContent = "Verify OTP";
          
          showMessage("Verification code sent to your email!", "success");
        } catch (error) {
          console.error("Initiation error details:", error.response?.data || error.message);
          showMessage(error.response?.data?.message || "Failed to initiate registration process.", "error");
        }
      });

      // STEP 2 Submission handler: POST OTP verification token
      otpForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorBanner.style.display = "none";

        const otpCode = document.getElementById("verificationOtp").value.trim();

        if (!otpCode || otpCode.length !== 6) {
          showMessage("Please provide a valid 6-digit verification code.", "error");
          return;
        }

        try {
          await axios.post("/bank/auth/register/verify", {
            email: cachedEmailAddress,
            otp: otpCode
          });

          showMessage("Account verified and created successfully!", "success");
          otpForm.reset();
          registerForm.reset();
          
          // Redirect to login dashboard panel safely after timeout
          setTimeout(() => {
            goToLogin();
          }, 2000);

        } catch (error) {
          console.error("OTP verification error details:", error.response?.data || error.message);
          showMessage(error.response?.data?.message || "Invalid or expired OTP token.", "error");
        }
      });

      function goToLogin() {
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
