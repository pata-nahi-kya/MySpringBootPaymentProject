<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment System - Create User</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .register-container {
        background-color: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 380px;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
      }
      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: bold;
      }
      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        background-color: #4caf50;
        color: white;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #45a049;
      }
      .secondary-button {
        background-color: #6f42c1;
        margin-top: 10px;
      }
      .secondary-button:hover {
        background-color: #5935a1;
      }
      .message {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        text-align: center;
        display: none;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <h1>Create User</h1>
      <form id="registerForm">
        <div class="form-group">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" placeholder="Username" required />
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input
            type="password"
            id="regPassword"
            placeholder="Password"
            required
          />
        </div>
        <div class="form-group">
          <label for="regMoney">Initial Balance</label>
          <input
            type="number"
            id="regMoney"
            placeholder="Initial balance"
            min="0"
            value="0"
          />
        </div>
        <div class="form-group">
          <label for="regRole">Role</label>
          <select id="regRole" required>
            <!-- radio button  -->
            <option value="">Select Role</option>
            <option value="USER">User</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <button type="submit">Create User</button>
      </form>
      <button class="secondary-button" onclick="goBack()">
        Back to Dashboard
      </button>
      <div id="message" class="message"></div>
    </div>

        <script>
      const errorBanner = document.getElementById("message");

      // 1. Initial Access Check
      if (!localStorage.getItem("jwtToken")) {
        window.location.href = "index.html";
      }

      function showMessage(text, type) {
        errorBanner.textContent = text;
        errorBanner.className = `message ${type}`;
        errorBanner.style.display = "block";
      }

      /**
       * FIXED: Reads the refresh token automatically from HTTP cookies.
       * Uses the updated backend accessToken mapping key.
       */
      async function refreshToken() {
        try {
          const response = await axios.post(`/bank/auth/refresh`, null, {
            withCredentials: true // Transmits the secure HttpOnly cookie wrapper
          });

          if (response.data?.token) {
            localStorage.setItem("jwtToken", response.data.accessToken);
            return true;
          }
        } catch (err) {
          console.error("Refresh sequence failed inside registration panel:", err);
        }
        logout();
        return false;
      }

      /**
       * Core Request Interceptor Engine
       */
      async function sendRequest(config) {
        config.headers = config.headers || {};
        config.headers.Authorization = `Bearer ${localStorage.getItem("jwtToken")}`;
        try {
          const response = await axios(config);
          return response.data;
        } catch (error) {
          if (error.response?.status === 401) {
            console.log("Access token expired during form submission. Renewing...");
            const refreshed = await refreshToken();
            if (refreshed) {
              config.headers.Authorization = `Bearer ${localStorage.getItem("jwtToken")}`;
              return (await axios(config)).data;
            }
          }
          throw error;
        }
      }

      document
        .getElementById("registerForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();
          errorBanner.style.display = "none";

          // FIXED: Standardized to a clean lowercase customerName variable name matching the payload
          const customerName = document.getElementById("regUsername").value.trim();
          const password = document.getElementById("regPassword").value.trim();
          const money = Number(document.getElementById("regMoney").value) || 0;
          const role = document.getElementById("regRole").value;

          if (!customerName || !password || !role) {
            showMessage("Please fill in all fields.", "error");
            return;
          }

          try {
            await sendRequest({
              method: "post",
              // FIXED: Added leading slash to ensure stable server endpoint tracking routing
              url: `/bank/admin/createUser`, 
              data: {
                // FIXED: Property labels match your backend DTO property names exactly
                customerName: customerName,
                password: password,
                money: money,
                role: [role] 
              },
            });

            showMessage("User created successfully.", "success");
            document.getElementById("registerForm").reset();
          } catch (error) {
            console.error("Registration error details:", error.response?.data || error.message);
            showMessage(
              error.response?.data?.message || "Failed to create user. Ensure you have Admin privileges.",
              "error"
            );
          }
        });

      function goBack() {
        window.location.href = "dashboard.html";
      }

      function logout() {
        localStorage.removeItem("jwtToken");
        window.location.href = "index.html";
      }
    </script>

  </body>
</html>
