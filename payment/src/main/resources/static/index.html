<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment System - Login</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .login-container {
        background-color: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 300px;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #45a049;
      }
      .form-section {
        margin-bottom: 20px;
      }
      .form-toggle {
        text-align: center;
        margin-bottom: 10px;
      }
      .form-toggle button {
        background: none;
        border: none;
        color: #4caf50;
        cursor: pointer;
        text-decoration: underline;
        font-size: 14px;
      }
      .form-toggle button:hover {
        color: #45a049;
      }
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2 id="formTitle">Login</h2>
      <div id="loginForm" class="form-section">
        <form id="loginFormElement">
          <input type="text" id="username" placeholder="Username" required />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <button type="submit">Login</button>
        </form>
      </div>

      <div id="registerForm" class="form-section" style="display: none">
        <form id="registerFormElement">
          <input type="text" id="regUsername" placeholder="Username" required />
          <input
            type="password"
            id="regPassword"
            placeholder="Password"
            required
          />
          <input
            type="number"
            id="regMoney"
            placeholder="Initial Balance (optional)"
            min="0"
            value="0"
          />
          <select id="regRole" required>
            <option value="">Select Role</option>
            <option value="USER">User</option>
            <option value="ADMIN">Admin</option>
          </select>
          <button type="submit">Create Account</button>
        </form>
      </div>

      <div class="form-toggle">
        <button id="toggleBtn" type="button">Create New Account</button>
      </div>
      <div id="error" class="error"></div>
    </div>

    <script>  

      document
        .getElementById("toggleBtn")
        .addEventListener("click", function () {
          const loginForm = document.getElementById("loginForm");
          const registerForm = document.getElementById("registerForm");
          const formTitle = document.getElementById("formTitle");
          const toggleBtn = document.getElementById("toggleBtn");

          if (loginForm.style.display === "none") {
            loginForm.style.display = "block";
            registerForm.style.display = "none";
            formTitle.textContent = "Login";
            toggleBtn.textContent = "Create New Account";
          } else {
            loginForm.style.display = "none";
            registerForm.style.display = "block";
            formTitle.textContent = "Create Account";
            toggleBtn.textContent = "Back to Login";
          }
          document.getElementById("error").textContent = "";
        });

      // Login form handler
      document
        .getElementById("loginFormElement")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          try {
            const response = await fetch(
              `/bank/admin/authenticate/${username}/${password}`,
              {
                method: "PUT",
              },
            );
            const data = await response.json();

            if (data.token) {
              localStorage.setItem("jwtToken", data.token);
              localStorage.setItem("username", username); 
              window.location.href = "dashboard.html";
            } else {
              document.getElementById("error").textContent =
                data.message || "Login failed";
            }
          } catch (error) {
            document.getElementById("error").textContent = "An error occurred";
          }
        });

      // Registration form handler
      document
        .getElementById("registerFormElement")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const username = document.getElementById("regUsername").value;
          const password = document.getElementById("regPassword").value;
          const money =
            parseInt(document.getElementById("regMoney").value) || 0;
          const role = document.getElementById("regRole").value;

          try {
            const response = await fetch("/bank/admin/createUser", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                customerName: username,
                password: password,
                money: money,
                role: [role], // Backend expects Set<Role>, so send as array
              }),
            });

            if (response.ok) {
              const userData = await response.json();
              document.getElementById("error").style.color = "green";
              document.getElementById("error").textContent =
                "Account created successfully! You can now login.";
              // Switch back to login form after successful registration
              setTimeout(() => {
                document.getElementById("toggleBtn").click();
              }, 2000);
            } else {
              const errorData = await response.json();
              document.getElementById("error").textContent =
                errorData.message || "Registration failed";
            }
          } catch (error) {
            document.getElementById("error").textContent = "An error occurred";
          }
        });
    </script>
  </body>
</html>
